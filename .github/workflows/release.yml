# Сборка Windows .exe (PyInstaller) и публикация GitHub Release.
# Запуск: docs/RELEASE_NOTES/**, тег v*, или workflow_dispatch.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['docs/RELEASE_NOTES/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Версия и описание
        id: meta
        shell: bash
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          NOTES="docs/RELEASE_NOTES/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "✗ нет $NOTES — добавьте описание выпуска"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "✗ тег $GITHUB_REF_NAME, а версия в pyproject.toml — $VERSION"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "notes=$NOTES"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Версия $VERSION"

      - name: Зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Сборка .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "DP_Autoclicker" `
            --collect-all PySide6 `
            --collect-all pynput `
            --add-data "presets;presets" `
            --hidden-import dp_autoclicker `
            --hidden-import dp_autoclicker.app `
            run.py

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: DP_Autoclicker-windows
          path: dist/DP_Autoclicker.exe
          if-no-files-found: error

      - name: SHA-256
        id: hash
        shell: bash
        run: |
          HASH=$(sha256sum dist/DP_Autoclicker.exe | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $HASH"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DP Autoclicker ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.meta.outputs.notes }}
          files: dist/DP_Autoclicker.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
